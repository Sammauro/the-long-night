<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Long Night</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" class="boot">THE LONG NIGHT</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/manifest.js"></script>
  <script>
    // Carica gli script nell'ordine di src/manifest.js (script classici, funziona anche da file://).
    (function () {
      var files = TLN.manifest.all();
      var i = 0;
      function next() {
        if (i >= files.length) { TLN.ui.boot(); return; }
        var s = document.createElement('script');
        s.src = files[i++] + '?v=1';
        s.onload = next;
        s.onerror = function () { console.error('Script mancante: ' + s.src); next(); };
        document.body.appendChild(s);
      }
      next();
    })();
  </script>
</body>
</html>
