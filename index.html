<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>The Long Night</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style_ui.css">
  <link rel="stylesheet" href="style_mobile.css">
</head>
<body>
  <canvas id="gc"></canvas>
  <div id="cell-labels"></div>
  <div id="fx-layer"></div>
  <div class="vignette"></div>

  <div id="game">
    <div id="hud" class="panel"></div>
    <div id="enemies" class="panel"></div>
    <div id="enemy-sheet" class="panel"></div>
    <div id="log" class="panel"><div class="log-h"><button id="log-toggle" class="btn ghost">Registro</button><button id="log-copy" class="btn ghost">Copia</button></div><div id="log-lines"></div></div>
    <div id="modebar"></div>
    <div id="seq-row"><div id="preview"></div><div id="seq"></div></div>
    <div id="bottom">
      <div id="plancia" class="panel"></div>
      <div id="hand"></div>
      <div id="side"><div id="open-card" class="panel"></div><div id="controls" class="panel"></div></div>
    </div>
  </div>

  <div id="coach"></div>
  <div id="screens"></div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="modal"></div>
  <div id="rotate-hint">Ruota il telefono in orizzontale</div>
  <div id="boot" class="boot"><div class="boot-title">THE LONG NIGHT</div><div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div><div class="boot-label" id="boot-label">La candela si accende…</div></div>

  <!-- Diagnostica a schermo: mostra avanzamento del caricamento ed eventuali errori (utile su telefono, dove non c'è console) -->
  <div id="diag" style="display:none;position:fixed;left:8px;right:8px;bottom:8px;max-height:45%;overflow:auto;z-index:99999;background:#1c1a24;border:1px solid #b84040;color:#e8e0d0;font:12px/1.4 monospace;padding:8px;white-space:pre-wrap"></div>
  <script>
    window.TLN_DIAG = function (msg) { var d = document.getElementById('diag'); d.style.display = 'block'; d.textContent += msg + '\n'; };
    window.addEventListener('error', function (e) { TLN_DIAG('ERRORE: ' + (e.message || e) + (e.filename ? ' @ ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { TLN_DIAG('ERRORE (promise): ' + (e.reason && e.reason.message || e.reason)); });
    (function () { try { var c = document.createElement('canvas'); if (!(c.getContext('webgl') || c.getContext('experimental-webgl'))) TLN_DIAG('WebGL non disponibile in questo browser.'); } catch (e) { TLN_DIAG('Controllo WebGL fallito: ' + e.message); } })();
  </script>
  <script src="src/manifest.js"></script>
  <script>
    // Caricamento con barra di avanzamento (script classici, funziona anche da file://).
    (function () {
      // 1) motore 3D (Three.js r128) dal CDN, con copia locale se il CDN non risponde
      // 2) script del gioco: scaricati in parallelo, eseguiti in ordine (async = false)
      var CDN = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', LOCAL = 'vendor/three.r128.min.js';
      var files = TLN.manifest.all(), N = files.length, done = 0, booted = false, phase = 'three', creep = 0;
      var fill = document.getElementById('boot-fill'), label = document.getElementById('boot-label');
      var LINES = ['Si contano i dadi…', 'Si mescolano le carte…', 'Qualcosa si muove nella cripta…'];
      function show(pct, text) { fill.style.width = Math.min(100, pct) + '%'; label.textContent = text + '  ' + Math.round(pct) + '%'; }
      // durante il motore 3D la barra avanza piano fino al 30% (il browser non dà il progresso reale di uno script)
      var creepTimer = setInterval(function () { if (phase !== 'three') return; creep += (30 - creep) * 0.06; show(creep, 'La candela si accende…'); }, 200);
      files.forEach(function (f) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'script'; l.href = f + '?v=9'; document.head.appendChild(l); });
      var watchdog = setTimeout(function () { TLN_DIAG('Caricamento fermo (' + (phase === 'three' ? 'motore 3D' : done + '/' + N) + '). Se la rete è lenta, attendi ancora qualche secondo.'); }, 25000);
      function addScript(src, ok, ko) { var s = document.createElement('script'); s.src = src; s.async = false; s.onload = ok; s.onerror = ko; document.body.appendChild(s); }
      function loaded() {
        done++; show(30 + 70 * done / N, LINES[Math.min(LINES.length - 1, Math.floor(done / N * LINES.length))]);
        if (done < N || booted) return;
        booted = true; clearTimeout(watchdog); clearInterval(creepTimer);
        try { TLN.ui.boot(); } catch (e) { TLN_DIAG('ERRORE all\'avvio: ' + e.message + '\n' + (e.stack || '').split('\n').slice(0, 4).join('\n')); }
      }
      function gameScripts() {
        phase = 'game'; if (!window.THREE) TLN_DIAG('Three.js non caricato (né CDN né copia locale).');
        show(30, LINES[0]);
        files.forEach(function (f) { addScript(f + '?v=9', loaded, function () { TLN_DIAG('Script mancante: ' + f); loaded(); }); });
      }
      addScript(CDN, gameScripts, function () { addScript(LOCAL, gameScripts, gameScripts); });
    })();
  </script>
</body>
</html>
